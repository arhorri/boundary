# DataLoader settings measured on each host by notebooks/04_dataset.ipynb.
# Keyed BY PLATFORM: Colab and Kaggle have different CPU counts, so a
# single num_workers would be wrong on one of them. Running this notebook
# on a host updates only that host's entry.
#
# Read it as: hosts[<platform>][num_workers], falling back to 2.
#
# Both cached and uncached rates are recorded on purpose. The uncached
# numbers measure Drive I/O, which has varied 24x between sessions on
# identical hardware; keeping them visible is how that stays diagnosable
# instead of being hidden behind the cache.
hosts:
  colab:
    measured_utc: '2026-09-05T20:13:35Z'
    gpu: none (CPU only)
    cpu_count: 2
    batch_size: 8
    batches_timed: 200
    num_workers: 2
    cache_images: true
    cache_mb: 165.7
    cached_tiles_per_second:
      0: 282.8
      2: 385.5
      4: 256.9
    uncached_tiles_per_second:
      0: 48.1
      2: 75.5
      4: 46.2
    cache_cold_seconds: 359.42
    cache_cold_source: cold
    cache_warm_seconds: 0.84
    cache_key: 9c8476cbb16fc035
    cache_dir: /content/drive/MyDrive/phase11-persistent/tile_cache
  kaggle:
    measured_utc: null
    cpu_count: 2
    num_workers: 2
    note: default for a 2-CPU Kaggle kernel; not yet measured
