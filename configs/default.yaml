# Default configuration. Placeholder keys only.
# null = to be measured / decided in a later step. Do not invent values.

paths:
  data_root: null
  audit_json: null
  output_dir: null
  checkpoint_dir: null
  tensorboard_dir: null

patch:
  size: null
  stride: null
  overlap: null
  pad_mode: null

augment:
  spatial: null
  photometric: null

# The network (step 5). Consumed by src/model.py. No value here is a
# placeholder any more: these are the decisions step 5 made.
model:
  arch: unet
  encoder: resnet34
  # ImageNet weights on grayscale SEM images are still worth having: the early
  # filters are edge and texture detectors, which is exactly what a phase
  # boundary is. null here means random init.
  encoder_weights: imagenet
  in_channels: 1            # micrographs are single-channel; see src/model.py
  classes: 1                # one boundary logit map, no activation
  # The decoder starts random and its first gradients are noise. Letting that
  # into a pretrained encoder in epoch 1 erases the pretraining before it is
  # used. A starting value for step 6 to confirm, not a measured one.
  freeze_encoder_epochs: 3

# The compound loss (step 5). Consumed by src/losses.py.
#   L = w_bce * BCEWithLogits(pos_weight) + w_dice * SoftDice + w_cldice * clDice
# pos_weight is NOT here: it is a property of the fold being trained and is
# read from configs/fold_stats.yaml, which differs by 2.2x across the folds.
loss:
  w_bce: 1.0
  w_dice: 1.0
  w_cldice: 0.5           # supports the other two, does not dominate them
  cldice_iters: 3         # soft-skeletonize depth; each iteration is erode+open
  # O(1), not O(eps). sigmoid(-20) over a 256x256 tile sums to 1.3e-4, which
  # dwarfs a 1e-6 epsilon and would score a correct empty prediction on an
  # empty val tile at ~0.99. See the src/losses.py docstring.
  smooth: 1.0
  eps: 1.0e-6             # division guard inside the clDice harmonic mean only

train:
  epochs: null
  # Measured by notebooks/05_model_and_loss.ipynb: the largest batch that fits
  # at patch 256 WITH the optimizer state, on the host that ran it.
  batch_size: 64   # measured on colab / Tesla T4, patch 256, peak 9.83 GB incl. AdamW state
  lr: null
  optimizer: null
  scheduler: null
  weight_decay: null
  num_workers: null
  seed: null
  val_split: null

inference:
  tile_size: null
  tile_overlap: null
  threshold: null
  overlay_color: null

# Boundary ground truth extraction (step 2). Consumed by src/boundary_gt.py;
# every value here is echoed into reports/gt_extraction.md so a run can be
# reproduced from the report alone.
boundary_gt:
  line_width_px: 2          # uniform width of the final boundary line
  # Speckle removal. "speckle" drops connected components smaller than
  # open_kernel**2 pixels. "morph" is the literal 3x3 morphological OPEN --
  # do not use it here: its erosion keeps a pixel only if all 9 neighbours are
  # set, and a boundary line is 1-3 px wide, so it erases the entire map.
  open_kernel: 3
  open_mode: speckle
  close_kernel: 3           # morphological CLOSE, seals 1-2 px gaps
  hsv_percentiles: [2, 98]  # MODE A window, derived from the pixels
  hsv_sample_files: 12      # masks sampled when deriving that window
  # Two mask colours closer than this in RGB are the same class: this is what
  # collapses Steel2's anti-aliasing ramp (45-52 raw colours, 2 real classes).
  # Real classes in this collection are >190 apart, so 48 is safe.
  palette_merge_distance: 48
  min_palette_share: 0.002  # a colour peak must hold this share of pixels
  max_unsnapped_fraction: 0.02  # reject a mask this far from its own palette
  output_subdir: gt_boundaries  # under PERSISTENT_DIR
  # Pairs never processed at all: a blank or corrupt mask is not a rejection,
  # it is data that should not have been there. Logged as excluded.
  exclusions:
    uhcs2:
      - uhcs0596.png        # 645x484, 100% [75,176,40], no annotation at all

  # Mask/image dimensions differing by at most this many px in either axis are
  # centre-cropped to their common size instead of rejected (e.g. MetalDam's
  # micrograph15 / micrograph19, 1024x702 masks against 1024x703 images).
  # Cropped, never resized. 0 rejects every mismatch.
  size_tolerance_px: 2

  # Colours suspected of being annotation rather than phase (scale bar, tool
  # mark, stray overlay). They are ALWAYS measured and reported -- per file in
  # the QC triptychs, per folder in reports/gt_extraction.md -- so the evidence
  # is visible before anything is changed. They are only folded into the
  # background class when fold_artifact_colours is true.
  #
  # Evidence in reports/audit.json for [75, 176, 40], the green in both folders:
  #   MetalDam  present in 10/24 sampled masks, 0.33% of pixels pooled,
  #             0.48% median where present, 142 components -- sporadic, and
  #             plausibly not a phase.
  #   uhcs2     present in 24/24 sampled masks, 6.8% of pixels pooled, 1.7%
  #             median where present (up to 16%), 14 components -- that is a
  #             phase, almost certainly the fourth microconstituent. Folding it
  #             would delete a real interface. Watch it; do not fold it without
  #             looking at the QC panels first.
  fold_artifact_colours: false
  artifact_colours:
    MetalDam:
      - [75, 176, 40]
    uhcs2:
      - [75, 176, 40]

# Remote-session settings. Every host-specific absolute path lives HERE and
# nowhere else: no module may contain a literal /content or /kaggle path.
# Consumed by scripts/bootstrap_session.py, src/paths.py and
# scripts/push_results.py.
session:
  repo_url: https://github.com/arhorri/boundary.git
  branch: main
  clone_dir_name: boundary

  # Dataset folders that must be present under the resolved data root.
  # Bootstrap fails loudly and lists what it actually found if any is missing.
  # Boundary maps from step 2. Resolved by src/paths.py as
  # GT_BOUNDARIES_ROOT, independently of PERSISTENT_DIR: on Colab it sits in
  # Drive beside the checkpoints, on Kaggle it is a separate read-only input.
  gt_subdir: gt_boundaries

  expected_datasets:
    - MetalDam
    - Steel1
    - Steel2
    - uhcs1
    - uhcs2

  colab:
    drive_mount: /content/drive
    # The uploaded copy of the repo's data/ folder.
    data_root: /content/drive/MyDrive/phase11-data/data
    # Survives session death: checkpoints, outputs, logs.
    persistent_dir: /content/drive/MyDrive/phase11-persistent

  kaggle:
    input_root: /kaggle/input
    working_dir: /kaggle/working
    dataset_slug: phase11-microstructure-data
    # The boundary maps, attached as a SECOND input dataset. Null here and set
    # in configs/kaggle.yaml on the kaggle branch, which is the only place the
    # two hosts differ.
    gt_dataset_slug: null
    # A host may prefer a branch carrying its own config overlay. The bootstrap
    # switches to it after the first clone, so the notebooks stay identical on
    # every branch and no pipeline logic is ever duplicated.
    branch: kaggle

# Tiling, parent grouping and the fold protocol (src/tiling.py).
tiling:
  patch_size: 256          # Steel1 and Steel2 ARE 256x256; 512 is impossible
  stride: 128              # 50% overlap
  pad_mode: reflect        # right and bottom edges only, where a tile overruns
  min_boundary_frac: 0.005 # a tile with less boundary than this teaches nothing
  weight_mode: parents     # parents | dataset | none
  seed: 0

  # stem -> parent_id. Tiles of one micrograph must never straddle a split.
  parent_rules:
    Steel1: '_\d+_\d+$'         # ..._4000x14_1_3 -> ..._4000x14
    Steel2: '_tile_\d+_\d+$'    # 87431041_tile_0_256 -> 87431041
  expected_parents:
    Steel1: 19             # 20 parents ship, one has no masks at all
  assert_single_tile: [Steel1, Steel2]

  # Split protocol.
  test_only: [Steel2]      # domain-shift fold: never trained or validated on
  parent_split:
    Steel1:
      val_parents: 4       # 15 train / 4 val of the 19 parents
  lodo_datasets: [MetalDam, uhcs1, uhcs2]

  gt_subdir: gt_boundaries
  manifest_subdir: manifests

  # The 48 Steel1 tiles of parent im_val_cut10-400-01-V-9mm-4000x13, which
  # ships images but no masks. They have no ground truth and cannot be
  # trained on; naming them here means they are reported, not silently
  # dropped at pairing time.
  exclusions:
    Steel1:
      - im_val_cut10-400-01-V-9mm-4000x13_1_1.png
      - im_val_cut10-400-01-V-9mm-4000x13_1_2.png
      - im_val_cut10-400-01-V-9mm-4000x13_1_3.png
