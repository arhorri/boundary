# Tile reading and augmentation (src/dataset.py).
# Spatial transforms hit image AND mask identically; photometric transforms
# hit the image only. Masks are always nearest-neighbour.
dataset:
  patch_size: 256

  # spatial — image and mask together
  p_hflip: 0.5
  p_vflip: 0.5
  p_rot90: 0.5
  p_affine: 0.5
  affine_shift: 0.0625      # fraction of the tile
  affine_scale: 0.10        # +/- 10%
  affine_rotate: 15         # degrees
  p_elastic: 0.15
  elastic_alpha: 20.0       # low: a micrograph must stay physically plausible
  elastic_sigma: 6.0

  # photometric — image only. Heavier than usual on purpose: the held-out fold
  # is always a different microscope and there is no domain-adaptation stage,
  # so this is the model's only preparation for an unseen detector.
  p_brightness_contrast: 0.5
  brightness_limit: 0.25
  contrast_limit: 0.25
  p_gamma: 0.3
  gamma_limit: [70, 140]
  p_noise: 0.25
  noise_std_range: [0.02, 0.10]
  p_blur: 0.2
  blur_limit: 3
  p_clahe: 0.2
  clahe_clip_limit: 2.0

  # Source images live on Drive (Colab) or a read-only input (Kaggle), and
  # every tile is a crop of one. Reading them per tile makes training
  # I/O-bound: a measured run fell from 115.7 to 4.8 tiles/s between two
  # sessions on identical hardware, purely on Drive variance. Decoding each
  # source once costs a few hundred MB and removes that variance entirely.
  cache_images: true
  cache_preload: true       # decode everything up front, where the cost is visible
  cache_max_mb: 4096        # refuse to start rather than exhaust the session

  # A cold decode of ~1000 source images off Drive costs ~0.6 s EACH -- that is
  # per-file round-trip latency, not decode time -- so ~27 minutes, paid again
  # on every session start and every crash resume. The decoded arrays are
  # therefore written to ONE file under PERSISTENT_DIR, keyed by a hash of the
  # source images and their crops: a changed manifest rebuilds and says so,
  # rather than silently serving arrays that no longer match.
  persist_cache: true
  cache_subdir: tile_cache

  manifest_subdir: manifests
  gt_subdir: gt_boundaries
