# Boundary ground truth extraction (step 2). Consumed by src/boundary_gt.py;
# every value here is echoed into reports/gt_extraction.md so a run can be
# reproduced from the report alone.
boundary_gt:
  line_width_px: 2          # uniform width of the final boundary line
  # Speckle removal. "speckle" drops connected components smaller than
  # open_kernel**2 pixels. "morph" is the literal 3x3 morphological OPEN --
  # do not use it here: its erosion keeps a pixel only if all 9 neighbours are
  # set, and a boundary line is 1-3 px wide, so it erases the entire map.
  open_kernel: 3
  open_mode: speckle
  close_kernel: 3           # morphological CLOSE, seals 1-2 px gaps
  hsv_percentiles: [2, 98]  # MODE A window, derived from the pixels
  hsv_sample_files: 12      # masks sampled when deriving that window
  # Two mask colours closer than this in RGB are the same class: this is what
  # collapses Steel2's anti-aliasing ramp (45-52 raw colours, 2 real classes).
  # Real classes in this collection are >190 apart, so 48 is safe.
  palette_merge_distance: 48
  min_palette_share: 0.002  # a colour peak must hold this share of pixels
  max_unsnapped_fraction: 0.02  # reject a mask this far from its own palette
  output_subdir: gt_boundaries  # under PERSISTENT_DIR
  # Pairs never processed at all: a blank or corrupt mask is not a rejection,
  # it is data that should not have been there. Logged as excluded.
  exclusions:
    uhcs2:
      - uhcs0596.png        # 645x484, 100% [75,176,40], no annotation at all

# Remote-session settings. Every host-specific absolute path lives HERE and
# nowhere else: no module may contain a literal /content or /kaggle path.
# Consumed by scripts/bootstrap_session.py, src/paths.py and
# scripts/push_results.py.
session:
  repo_url: https://github.com/arhorri/boundary.git
  branch: main
  clone_dir_name: boundary

  # Dataset folders that must be present under the resolved data root.
  # Bootstrap fails loudly and lists what it actually found if any is missing.
  expected_datasets:
    - MetalDam
    - Steel1
    - Steel2
    - uhcs1
    - uhcs2

  colab:
    drive_mount: /content/drive
    # The uploaded copy of the repo's data/ folder.
    data_root: /content/drive/MyDrive/phase11-data/data
    # Survives session death: checkpoints, outputs, logs.
    persistent_dir: /content/drive/MyDrive/phase11-persistent

  kaggle:
    input_root: /kaggle/input
    working_dir: /kaggle/working
    dataset_slug: phase11-microstructure-data
